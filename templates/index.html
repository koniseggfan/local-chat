<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Chat</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><section id="account-gate" class="gate"><div class="gate-card"><p class="eyebrow">LOCAL CHAT</p><h1 id="account-title">Sign in</h1><p id="account-intro">Sign in to your private account.</p><form id="account-form"><label for="account-name">Display name</label><input id="account-name" maxlength="40" required placeholder="Your name" autocomplete="username"><label for="account-password">Password</label><input id="account-password" type="password" minlength="8" required placeholder="At least 8 characters" autocomplete="current-password"><button id="account-submit">Sign in</button></form><button id="account-mode" class="plain account-mode" type="button">Create account</button><p class="note">Passwords are securely hashed on the server. Your private chats belong only to your account.</p></div></section><div id="app" hidden><aside><div class="brand">◉ <span>Local Chat</span></div><button id="new-chat" class="new">＋ New chat</button><div id="chat-list"></div><div class="side-bottom"><button id="settings-button" class="plain">⚙ Settings</button><button id="sign-out" class="plain">⇥ Switch profile</button></div></aside><main><header><div><p class="eyebrow">PRIVATE • ON THIS DEVICE</p><h1 id="chat-title">New chat</h1></div><button id="research-toggle" class="research">Search the web: Off</button></header><section id="settings" hidden><label>Theme <select id="theme"><option value="blue">Blue</option><option value="black">Black</option><option value="white">White</option></select></label></section><section id="chat"></section><form id="question-form"><textarea id="question" rows="1" maxlength="1000" required placeholder="Message Local Chat…"></textarea><button id="send">Send ↑</button></form></main></div><template id="user-template"><article class="message user"><div class="avatar">You</div><p></p></article></template><template id="answer-template"><article class="message answer"><div class="avatar">AI</div><div><p class="answer-text"></p><div class="sources"><b>Sources</b><ul></ul></div></div></article></template><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
